<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • CLUB VRUM</title>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <img src="img/logo-01.png" class="logo" alt="Club Vrum">

    <h4>CLUB <span>VRUM</span></h4>
    <p>Área exclusiva para membros.</p>

    <form>

        <input
            type="email"
            placeholder="E-mail"
            required
        >

        <input
            type="password"
            placeholder="Senha"
            required
        >

        <button type="submit">
            ENTRAR
        </button>
        
        <button type="button" class="cadastro-btn" onclick="window.location.href='cadastro.html'">
    CADASTRAR
</button>

    </form>

    <a href="#">Esqueci minha senha</a>

</div>

</body>
</html>
